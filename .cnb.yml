"main":
  push:
    - name: build-and-test
      docker:
        image: mcr.microsoft.com/playwright:v1.62.1-noble
      stages:
        - name: install
          script: |
            npm ci
        - name: build
          script: |
            npm run build
        - name: test
          script: |
            npm run test
  pull_request:
    - name: build-and-test
      docker:
        image: mcr.microsoft.com/playwright:v1.62.1-noble
      stages:
        - name: install
          script: |
            npm ci
        - name: build
          script: |
            npm run build
        - name: test
          script: |
            # 单测 + 真实浏览器验收（防止假装测试：
            # 必须真实控制浏览器并断言真实 DOM 状态）
            npm run test
  # 云端 CI 冒烟（浏览器验收）：依赖 playwright chromium，作为独立增强演示。
  # 若需在正式 CI 启用，可放开下面块并在 install 里加 `npx playwright install chromium`。
